{% load static %}
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Yane's Beauty & Skincare: belleza esencial para tu ritual diario." />
    <title>{% block title %}Yane's Beauty & Skincare{% endblock title %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'proyectoyaneapp/css/sitioyane.css' %}" />
  </head>
  <body>
    <header class="site-header">
      <nav class="navbar navbar-expand-lg py-3" aria-label="Navegación principal">
        <div class="container">
          <a class="navbar-brand" href="{% url 'Home' %}">
            <img src="{% static 'proyectoyaneapp/images/logo-horizontal.png' %}" alt="Yane's Beauty & Skincare" class="brand-logo" />
          </a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavigation" aria-controls="mainNavigation" aria-expanded="false" aria-label="Abrir menú">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="mainNavigation">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-4">
              <li class="nav-item"><a class="nav-link {% if request.path == '/' %}active{% endif %}" href="{% url 'Home' %}">Inicio</a></li>
              <li class="nav-item"><a class="nav-link {% if '/shop/' in request.path %}active{% endif %}" href="{% url 'Shop' %}">Colección</a></li>
              <li class="nav-item"><a class="nav-link {% if '/blog/' in request.path %}active{% endif %}" href="{% url 'Blog' %}">Journal</a></li>
              <li class="nav-item"><a class="nav-link {% if '/contact/' in request.path %}active{% endif %}" href="{% url 'Contact' %}">Contacto</a></li>
              <li class="nav-item"><a class="nav-cta" href="{% url 'Shop' %}">Ver productos <span aria-hidden="true">↗</span></a></li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main>{% block content %}{% endblock content %}</main>

    <footer class="site-footer">
      <div class="container d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
        <div>
          <p class="footer-brand mb-1">Yane's Beauty & Skincare</p>
          <p class="footer-note mb-0">Belleza consciente, todos los días.</p>
        </div>
        <p class="footer-note mb-0">© {% now "Y" %} Yane's Beauty</p>
      </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
